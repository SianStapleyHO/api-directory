name: "Deploy to Cluster"

on: 
  push:
    branches: 
      - main

jobs:
  image_scan:
    name: "Trivy SAST scan"
    runs-on: ubuntu-latest
    steps:
      - name: Scan dapperdox image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'quay.io/ukhomeofficedigital/dapperdox:latest'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
      - name: Scan Git Sync image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'quay.io/ukhomeofficedigital/git-sync:latest'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-setup-trivy: true

  k8s_api_scan:
    name: "Scan for deprecated k8s APIs"
    runs-on: ubuntu-latest
    env:
      K8S_SERVER_VERSION: 1.20.15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Download Pluto
        uses: FairwindsOps/pluto/github-action@master
      - name: Pluto scan for deprecated k8s APIs
        run: pluto detect-files -d kube --target-versions k8s=v$K8S_SERVER_VERSION
  
  deploy:
    name: "Deploy to cluster"
    runs-on: ubuntu-latest
    container: quay.io/ukhomeofficedigital/kd:v1.21.14
    needs: scan
    env:
      DRONE_DEPLOY_TO: acp-test
      KUBE_TOKEN_ACP_TEST: ${{ secrets.KUBE_TOKEN_ACP_TEST }}
      KUBE_TOKEN_ACP_NOTPROD: ${{ secrets.KUBE_TOKEN_ACP_NOTPROD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Update and add curl
        run: |
          apk update
          apk add curl
      - name: Run deployment script
        run: bin/deploy.sh